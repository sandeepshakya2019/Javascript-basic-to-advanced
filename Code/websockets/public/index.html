<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WebSocket Example</title>
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    </head>
    <body>
        <h1>WebSocket Client</h1>
        <button onclick="createSocket()">Create Socket Connection</button>
        <br />
        <br />
        <input type="" text id="messageInput" placeholder="Type message..." />
        <button id="btn">Send</button>
        <div id="messages"></div>

        <script>
            let isConnect = false;
            let socketId = "";

            const sendBtn = document.getElementById("btn");
            const inputMsg = document.getElementById("messageInput");

            sendBtn.addEventListener("click", () => {
                if (!isConnect) {
                    alert("First Connect to socket");
                    return;
                }
                const msg = inputMsg.value;
                if (!msg || msg === "") {
                    alert("Pleaser enter the msg");
                    return;
                }
                alert(msg);
            });

            function createSocket(params) {
                if (isConnect) {
                    alert("Socket is already created " + socketId);
                    return;
                }
                const socket = io("http://localhost:5000");
                socket.on("connect", () => {
                    isConnect = true;
                    socketId = socket.id;
                    alert("Success created " + socketId);
                });
            }
        </script>
    </body>
</html>
